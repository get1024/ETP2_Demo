[project]
name = "flexible-cobot-demo"
version = "0.1.0"
description = "Interactive MuJoCo demo for flexible human-robot collaboration with ABB YuMi."
requires-python = "==3.9.6"
dependencies = [
    "mujoco==3.3.7",
]

[project.scripts]
yumi-mujoco-demo = "yumi_mujoco_demo:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["yumi_mujoco_demo"]
